// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Pastas de compilação fora do OneDrive (ele trava as pastas que sincroniza e o build falha com
    // "Unable to delete directory") e sem acento no caminho. O APK sai em
    // C:\Users\<você>\.hubsaude-build\app\outputs\apk\debug\app-debug.apk
    layout.buildDirectory.set(file("${System.getProperty('user.home')}/.hubsaude-build/${project.name}"))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
